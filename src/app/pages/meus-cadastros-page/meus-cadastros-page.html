<app-plano-de-fundo>
  <app-header-pagina logoUrl="/logo-icon.png"></app-header-pagina>
  <main class="flex-grow bg-[#F0F2F5] rounded-tl-[40px] mt-0 pt-8 px-6 pb-32 z-10 overflow-y-auto">
    
    <div class="flex items-center mb-6">
      <button class="mr-4 text-[#07284E]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <h1 class="text-2xl font-bold text-[#07284E]">Meus Cadastros</h1>
    </div>

    <div class="flex justify-between items-center mb-4 p-3 bg-white rounded-lg shadow-sm cursor-pointer border border-gray-200">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
        <span class="font-semibold text-gray-700">Produtos</span>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>

    <div class="relative mb-6">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input 
        type="text" 
        placeholder="Pesquisar" 
        class="w-full pl-10 pr-4 py-3 bg-[#EEEEEE] rounded-full border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>

    <section class="space-y-12">
      @for (produto of produtos; track $index) {
        <app-cadastro-item-card
          [imagemUrl]="produto.imagemUrl"
          [categoria]="produto.categoria"
          [nome]="produto.nome"
          [lucro]="produto.lucro"
          [custo]="produto.custo"
          (onEditar)="onEditar(produto)"
          (onExcluir)="onExcluir(produto)">
        </app-cadastro-item-card>
      }
    </section>

  </main>
</app-plano-de-fundo>
