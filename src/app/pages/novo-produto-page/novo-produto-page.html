<app-plano-de-fundo>
  <app-header-pagina logoUrl="/logo-icon.png"></app-header-pagina>

  <main class="flex-grow bg-[#F0F2F5] rounded-tl-[40px] mt-0 pt-8 px-6 pb-32 z-10 overflow-y-auto">
    
    <div class="flex items-center mb-6">
      <button class="mr-4 text-[#07284E]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <h1 class="text-2xl font-bold text-[#07284E]">Novo produto</h1>
    </div>

    <form [formGroup]="novoProdutoForm" (ngSubmit)="onSubmit()">
      
      <section class="mb-8">
        <div class="flex items-center gap-2 mb-4">
          <img src="info-icon.png" alt="Info" class="h-5 w-5"> <h2 class="text-lg font-semibold text-gray-700">Insira as informações básicas</h2>
        </div>
        
        <div class="space-y-4">
          <app-input-claro [label]="'Campo 1'" id="campo1" [control]="getControl('campo1')"></app-input-claro>
          
          <div class="grid grid-cols-2 gap-4 mt-2">
            <app-input-claro [label]="'Campo 2'" id="campo2" [control]="getControl('campo2')"></app-input-claro>
            <app-input-claro [label]="'Campo 3'" id="campo3" [control]="getControl('campo3')"></app-input-claro>
          </div>
          
          <app-input-claro [label]="'Campo 4'" id="campo4" [control]="getControl('campo4')"></app-input-claro>

          <div class="grid grid-cols-2 gap-4 mt-2">
            <app-input-claro [label]="'Campo 5'" id="campo5" [control]="getControl('campo5')"></app-input-claro>
            <app-input-claro [label]="'Campo 6'" id="campo6" [control]="getControl('campo6')"></app-input-claro>
          </div>

          <app-input-claro [label]="'Campo 7'" id="campo7" [control]="getControl('campo7')"></app-input-claro>

          <div class="mt-2">
            <label for="Campo 8" class="text-sm font-medium text-gray-900">Campo 8</label>
            <textarea
              id="campo8" 
              [formControl]="getControl('campo8')"
              class="w-full h-24 px-4 py-3 bg-[#EEEEEE] rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
          </div>
        </div>
      </section>

      <section>
        <div class="flex items-center gap-2 mb-4">
          <img src="list-icon.png" alt="Lista" class="h-5 w-5"> <h2 class="text-lg font-semibold text-gray-700">Preencha a lista de materiais</h2>
        </div>

        <div class="space-y-3">
          @for (mat of materiais; track mat.nome) {
            <app-material-card [nome]="mat.nome" [quantidade]="mat.quantidade"></app-material-card>
          }

          <button type="button" class="w-full py-3 border-2 border-dashed border-blue-500 rounded-lg text-blue-500 font-bold flex items-center justify-center gap-3">
            <img src=".\mais.png" alt="Adicionar" class="h-5 w-5">
            Adicionar Material
          </button>
        </div>
      </section>

    </form>

  <div class="mt-2">
    <app-botao-primario 
      [name]="'CADASTRAR'" 
      [iconUrl]="'/seta.png'">
    </app-botao-primario>
  </div>
  </main>

</app-plano-de-fundo>
