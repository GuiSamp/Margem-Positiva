<!-- Contêiner principal que ocupa toda a tela com o gradiente de fundo -->
<div >
<app-plano-de-fundo></app-plano-de-fundo>
  <!-- Elemento para a curva de fundo decorativa -->
  <div
    class="absolute top-0 left-0 w-full h-full opacity-5 pointer-events-none"
  >
    <svg
      width="100%"
      height="100%"
      viewBox="0 0 375 812"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="xMidYMid slice"
    >
      <path
        d="M375 150C281.25 324.8 187.5 324.8 0 446.6V812H375V150Z"
        fill="white"
      />
    </svg>
  </div>

  <!-- Wrapper para o conteúdo principal, garantindo o espaçamento e centralização -->
  <main class="w-full max-w-sm mx-auto flex flex-col h-full z-10">
    <!-- Seção do Logo -->
    <header
      class="flex flex-col items-center justify-center pt-10 pb-8 flex-shrink-0"
    >
      <!-- SVG do Logo "Margem Positiva" -->

      
    </header>

    <!-- Seção do Formulário -->
    <div class="flex-grow flex flex-col justify-center">
      <!-- Textos de boas-vindas -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold">BEM-VINDO</h1>
        <p class="text-white/80 mt-1">Insira suas informações de acesso!</p>
      </div>

      <!-- Formulário -->
      <form class="flex flex-col space-y-4">
        <app-input-base
          [type]="'string'"
          [id]="'email'"
          [name]="'email'"
          [placeholder]="'E-MAIL'"
          [pathIcon]="'/mail-icon.png'"
        ></app-input-base>
        <app-input-base
          [type]="'string'"
          [id]="'senha'"
          [name]="'senha'"
          [placeholder]="'SENHA'"
          [pathIcon]="'/lock-icon.png'"
        ></app-input-base>

        <!-- Link "Esqueceu a senha?" -->
        <div class="pt-2">
          <a
            href="#"
            class="text-sm font-semibold underline text-[#97C7FF] hover:text-white transition-colors"
            >Esqueceu a senha?</a
          >
        </div>

        <app-botao-primario></app-botao-primario>

        <!-- Separador "ou" -->
        <div
          class="flex flex-row align-middle items-center justify-center py-3 gap-4"
        >
          <div class="border w-full border-b-[1.5px] border-white"></div>
          <span class="font-semibold text-sm text-white">ou</span>
          <div class="border w-full border-b-[1.5px] border-white"></div>
        </div>

        <app-botao-google></app-botao-google>
      </form>
    </div>

    <!-- Rodapé com link de registro -->
    <footer class="flex-shrink-0 py-6 text-center">
      <p class="text-xs text-white/80">
        Não tem uma conta?
        <a href="#" class="font-bold text-white hover:underline">Registre-se</a>
      </p>
    </footer>
  </main>
</div>
