<app-plano-de-fundo>

  <header class="relative text-white pt-8 px-6 pb-28 z-10">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-sm opacity-90">Bem vindo,</p>
        <h1 class="text-2xl font-bold">Rian Fonseca</h1>
      </div>
      <div class="bg-white/20 p-2 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
    </div>
    <p class="mt-4 text-lg opacity-90">O que você deseja fazer hoje?</p>

    <div class="mt-6 w-full space-y-3">
        <app-botao-primario [name]="'RELATÓRIOS'"  [iconUrl]= "'/relatorio.png'"></app-botao-primario>
        <app-botao-primario [name]="'NOVO PRODUTO'"  [iconUrl]= "'/mais.png'"></app-botao-primario>
        <app-botao-primario [name]="'NOVO INSUMO'"  [iconUrl]= "'/mais.png'"></app-botao-primario>
    </div>
  </header>

  <main class="flex-grow bg-[#F0F2F5] rounded-tl-[40px] -mt-10 pt-8 px-6 pb-28 overflow-y-auto z-10">
    <section>
      <div class="bg-white p-4 rounded-xl rounded-tl-[30px] shadow-md">
        <h2 class="text-lg font-bold text-gray-800 mb-3 px-1">Meus Itens</h2>
        <div class="grid grid-cols-2 gap-1">
          <div class="bg-[#2A65C9] text-white p-3 rounded-xl h-[72px] flex flex-col justify-between">
            <h3 class="font-semibold text-sm">Produtos</h3>
            <div class="flex justify-between items-end">
              <img src="./produto.png" alt="Produtos" class="w-6 h-6">
              <div class="text-right leading-none">
                <span class="text-2xl font-bold">16</span>
                <span class="text-[10px] ml-1">cadastros</span>
              </div>
            </div>
          </div>
          <div class="bg-[#2A65C9] text-white p-3 rounded-xl h-[72px] flex flex-col justify-between">
            <h3 class="font-semibold text-sm">Insumos</h3>
            <div class="flex justify-between items-end">
              <img src="./insumo.png" alt="Insumos" class="w-6 h-6">
              <div class="text-right leading-none">
                <span class="text-2xl font-bold">32</span>
                <span class="text-[10px] ml-1">cadastros</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

<section class="mt-8">
  <h2 class="text-lg font-bold text-gray-800 mb-3">Acessados recentemente</h2>
  <div class="grid grid-cols-2 gap-4">
    <app-produto-card
      *ngFor="let produto of produtosRecentes"
      [imagemUrl]="produto.imagemUrl"
      [titulo]="produto.titulo"
      [custo]="produto.custo"
      [quantidade]="produto.quantidade"
      [lucro]="produto.lucro">
    </app-produto-card>
  </div>
</section>
</main>

<app-barra-navegacao
  painelIconUrl="./painel.png"
  cadastrosIconUrl="./cadastro.png"
  perfilIconUrl="./perfil.png">
</app-barra-navegacao>


</app-plano-de-fundo>
