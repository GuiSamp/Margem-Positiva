<div class="pt-4">
  <button
    class="w-full h-12 rounded-lg font-bold text-sm tracking-wider relative flex items-center justify-center bg-[#0051FF] overflow-hidden group 
           transition-all duration-300 
           shadow-[0_10px_25px_-5px_rgba(255,0,0,0.4)] 
           hover:shadow-[0_15px_35px_-5px_rgba(255,0,0,0.5)]"
  >
     <span class="z-10 pr-12 text-white">{{ name }}</span>
    
    <div
      class="absolute right-0 top-0 h-full w-14 bg-white"
      style="clip-path: polygon(35% 0, 100% 0, 100% 100%, 0% 100%)"
    ></div>
    
    @if (iconUrl) {
      <div class="absolute right-3 top-1/2 -translate-y-1/2 group-hover:scale-110 transition-transform">
        <img [src]="iconUrl" alt="Ícone" class="h-6 w-6">
      </div>
    }
  </button>
</div>
